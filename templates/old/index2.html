<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UI Prototype</title>
<style>
        header {
            text-align: center;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .ui {
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
        }

        .video_space {
            width: 70%;
            height: auto;
            background: black;
        }

        .menu_space {
            width: 30%;
            height: 100%;
            background: #F6E27F;
        }

</style>
    </head>
    <body>
        <header>
            <h2>UI Prototype</h2>
            <p>Made by:<br>name1<br>name2</p>
        </header>
        <div class="ui">
            <div class="video_space">
            </div>
            <div class="menu_space">
            </div>
        </div>
    </body>
</html>
